name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: v5.8.1
  KUBECONFORM_VERSION: v0.8.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Dependências (lockfile com hashes)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8" "pytest-asyncio>=0.24" "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Config do gateway é válido
        env:
          AZURE_API_KEY: x
          AZURE_API_BASE: https://example.openai.azure.com
          AZURE_API_VERSION: 2025-04-01-preview
          LITELLM_MASTER_KEY: sk-ci
          LITELLM_SALT_KEY: sk-ci
          DATABASE_URL: postgresql://ci:ci@localhost/ci
        run: python -m ai_gateway --config config/config.yaml --check

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instala kustomize e kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
      - run: make k8s-validate
      - name: GitHub App
        run: |
          kustomize build clients/github-app/deploy | kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Sobe gateway + Postgres + mock da Azure
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Testes de ponta a ponta
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8" "pytest-asyncio>=0.24"
          pytest -m integration tests/integration -v
      - name: Logs do gateway
        if: failure()
        run: docker compose logs gateway | tail -300
      - if: always()
        run: docker compose down -v

  image:
    if: github.event_name == 'push'
    needs: [test, kubernetes, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: ai-gateway
            context: .
          - name: ai-gateway-github-app
            context: clients/github-app
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
