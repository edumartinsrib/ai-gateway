# Mesmo padrão do gateway: tudo sensível vem do vault.
#   vault kv put secret/github-app/app private_key=@app.private-key.pem webhook_secret=...
#   gatewayctl key create --team github-app --alias github-app-prod --client github-app
#   vault kv put secret/github-app/gateway api_key=sk-...
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: github-app-vault
spec:
  provider:
    vault:
      server: https://vault.change-me.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: github-app
          serviceAccountRef:
            name: github-app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: github-app-vault
  target:
    name: github-app-secrets
  data:
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: { key: github-app/app, property: private_key }
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef: { key: github-app/app, property: webhook_secret }
    - secretKey: GATEWAY_API_KEY
      remoteRef: { key: github-app/gateway, property: api_key }
