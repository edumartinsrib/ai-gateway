apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-app
  annotations:
    secret.reloader.stakater.com/reload: github-app-secrets
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: github-app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: github-app }
    spec:
      serviceAccountName: github-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: github-app
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: github-app-env }
            - secretRef: { name: github-app-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: github-app
spec:
  selector: { app.kubernetes.io/name: github-app }
  ports:
    - { name: http, port: 8080, targetPort: http }
