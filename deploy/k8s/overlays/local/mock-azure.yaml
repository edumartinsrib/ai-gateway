apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-azure
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mock-azure }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mock-azure }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mock-azure
          image: mock-azure:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: MOCK_AZURE_API_KEY, value: mock-azure-key }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: mock-azure
spec:
  selector: { app.kubernetes.io/name: mock-azure }
  ports:
    - { name: http, port: 8080, targetPort: http }
