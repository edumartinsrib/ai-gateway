apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  labels:
    app.kubernetes.io/name: ai-gateway
  annotations:
    # Com o Stakater Reloader instalado, uma rotação da chave no vault (sincronizada
    # pelo ESO para o Secret) reinicia os pods automaticamente. Sem ele, é inofensivo.
    secret.reloader.stakater.com/reload: ai-gateway-secrets
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway
    spec:
      serviceAccountName: ai-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
      containers:
        - name: gateway
          image: ai-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: ai-gateway-env
          env:
            # Segredos: vêm do vault via External Secrets Operator -> Secret ai-gateway-secrets.
            # Chave ausente = CreateContainerConfigError (falha visível, antes do boot).
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef: { name: ai-gateway-secrets, key: AZURE_API_KEY }
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: ai-gateway-secrets, key: LITELLM_MASTER_KEY }
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef: { name: ai-gateway-secrets, key: LITELLM_SALT_KEY }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: ai-gateway-secrets, key: DATABASE_URL }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: ai-gateway-secrets, key: REDIS_PASSWORD, optional: true }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME)
          # O primeiro boot aplica as migrações do banco (Prisma): até 5 min.
          startupProbe:
            httpGet: { path: /health/liveliness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Dá tempo do pod sair dos endpoints antes do SIGTERM (streams em andamento).
            preStop:
              exec:
                command: ["sleep", "15"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
