apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ai-gateway-vault
spec:
  provider:
    vault:
      server: https://vault.example.com   # altere no overlay
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ai-gateway
          serviceAccountRef:
            name: ai-gateway
