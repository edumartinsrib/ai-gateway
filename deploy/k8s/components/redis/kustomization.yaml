# Redis compartilhado entre réplicas (ex.: Azure Cache for Redis). Com REDIS_HOST definido,
# o entrypoint liga no LiteLLM o roteamento/cooldown compartilhado e o buffer de gasto em
# Redis, evitando que réplicas diferentes deixem passar gasto acima do orçamento.
#
# Este componente só acrescenta a senha do Redis ao ExternalSecret (liste-o DEPOIS do
# componente de vault). Defina no configMapGenerator do overlay:
#   REDIS_HOST=<host>  REDIS_PORT=6380  REDIS_SSL=true
# No Azure Key Vault, troque o remoteRef por: { key: ai-gateway-redis-password }
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: ExternalSecret, name: ai-gateway-secrets }
    patch: |-
      - op: add
        path: /spec/data/-
        value:
          secretKey: REDIS_PASSWORD
          remoteRef: { key: ai-gateway/redis, property: password }
