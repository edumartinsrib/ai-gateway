# Requer Prometheus Operator (ServiceMonitor/PrometheusRule) e o sidecar de dashboards do
# Grafana (kube-prometheus-stack), que importa ConfigMaps com o label grafana_dashboard=1.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - servicemonitor.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: ai-gateway-grafana-dashboard
    files:
      - dashboards/ai-gateway.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
