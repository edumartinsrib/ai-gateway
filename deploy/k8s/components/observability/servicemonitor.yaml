apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-gateway
  labels:
    release: kube-prometheus-stack   # ajuste ao seletor do seu Prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  endpoints:
    - port: metrics
      path: /metrics/
      interval: 30s
