apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-gateway
spec:
  parentRefs:
    - name: public-gateway          # altere no overlay
      namespace: gateway-system
  hostnames:
    - ai-gateway.example.com        # altere no overlay
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
      backendRefs:
        - name: ai-gateway
          port: 4000
      # Respostas longas de modelos de raciocínio e streams (SSE).
      timeouts:
        request: 600s
