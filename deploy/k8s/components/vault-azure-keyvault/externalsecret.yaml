apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-gateway-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ai-gateway-vault
  target:
    name: ai-gateway-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AZURE_API_KEY
      remoteRef: { key: azure-openai-api-key }
    - secretKey: LITELLM_MASTER_KEY
      remoteRef: { key: ai-gateway-master-key }
    - secretKey: LITELLM_SALT_KEY
      remoteRef: { key: ai-gateway-salt-key }
    - secretKey: DATABASE_URL
      remoteRef: { key: ai-gateway-database-url }
