apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt   # altere ou remova
    # Anotações para controladores baseados em NGINX: streams longos, sem buffer (SSE).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx                         # altere no overlay
  tls:
    - hosts: [ai-gateway.example.com]
      secretName: ai-gateway-tls
  rules:
    - host: ai-gateway.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: ai-gateway
                port: { name: http }
